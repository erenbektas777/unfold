services:
  - type: web
    name: unfold
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://unfold.onrender.com
      - key: MODERATION_SECRET
        value: unfold-admin-2026
